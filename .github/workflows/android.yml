name: LuaStudio Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            openjdk-17-jdk ant \
            python3-pip python3-venv \
            autoconf automake autopoint gettext \
            libtool libtool-bin libltdl-dev \
            autotools-dev autoconf-archive \
            pkg-config m4 \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

          echo "=== Autoconf ==="
          autoreconf --version

          echo "=== Libtoolize ==="
          libtoolize --version

          echo "=== Automake ==="
          automake --version

          echo "=== Libtool macros ==="
          ls -l /usr/share/aclocal/libtool.m4

      - name: Install Buildozer
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Build APK
        run: |
          source .venv/bin/activate

          CACHE=".buildozer/android/platform/build-arm64-v8a/packages/freetype"
          mkdir -p "$CACHE"

          curl -fL --retry 5 \
            "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz" \
            -o "$CACHE/freetype-2.14.1.tar.gz"

          ANT_DIR="$(dirname "$(dirname "$(readlink -f "$(which ant)")")")"
          sed -i '/^android.ant_path[[:space:]]*=/d' buildozer.spec
          sed -i "/^\[app\]/a android.ant_path = $ANT_DIR" buildozer.spec

          set +e
          buildozer -v android debug > build.log 2>&1
          BUILD_STATUS=$?
          echo "BUILD_STATUS=$BUILD_STATUS" >> "$GITHUB_ENV"
          exit "$BUILD_STATUS"

      - name: Mostrar resumo do erro
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "===== ERROS IMPORTANTES ====="
            grep -n -i -E "fatal error:|error:|traceback|exception|failed|longintrepr|no matching distribution" build.log | tail -n 100 || true

            echo "===== FINAL DO LOG ====="
            tail -n 80 build.log
          else
            echo "Arquivo build.log não encontrado"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuaStudio-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
