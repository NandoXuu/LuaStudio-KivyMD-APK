name: LuaStudio Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            openjdk-17-jdk \
            ant \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            automake

      - name: Install Buildozer
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Build APK
        run: |
          source .venv/bin/activate

          echo "Preparando FreeType..."
          CACHE=".buildozer/android/platform/build-arm64-v8a/packages/freetype"
          mkdir -p "$CACHE"

          curl -fL --retry 5 \
            "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz" \
            -o "$CACHE/freetype-2.14.1.tar.gz"

          echo "Configurando Apache Ant..."
          ANT_DIR="$(dirname "$(dirname "$(readlink -f "$(which ant)")")")"
          echo "Ant encontrado: $ANT_DIR"

          sed -i '/^android.ant_path[[:space:]]*=/d' buildozer.spec
          sed -i "/^\[app\]/a android.ant_path = $ANT_DIR" buildozer.spec

          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuaStudio-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
