name: LuaStudio AI Build Diagnosis

on:
  workflow_run:
    workflows: ["LuaStudio Android APK"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Download failed build logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > full.log

      - name: Extract error context
        run: |
          grep -n -B 30 -A 50 -E \
            'fatal error:|Cython.Compiler.Errors|CompileError|Traceback|ERROR:|error:|Exception|FAILED|No matching distribution|Could not find' \
            full.log | tail -n 1500 > error_excerpt.txt || true

          if [ ! -s error_excerpt.txt ]; then
            tail -n 400 full.log > error_excerpt.txt
          fi

          {
            echo "## Build error excerpt"
            echo '```text'
            cat error_excerpt.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare AI prompt
        run: |
          cat > ai-prompt.txt <<'EOF'
          You are an expert in Android Buildozer, python-for-android,
          Kivy, Pygame, Python packaging, and GitHub Actions.

          Analyze the following failed LuaStudio APK build.

          Identify:
          1. The earliest likely root cause.
          2. Which errors are secondary.
          3. The affected package, recipe, or configuration.
          4. Exact practical corrections.

          Do not mistake the final traceback for the root cause.
          Do not invent files, APIs, or fixes.
          If information is insufficient, say what is missing.

          BUILD LOG:
          EOF

          cat error_excerpt.txt >> ai-prompt.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Analyze build with Copilot CLI
        id: ai
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -p "$(cat ai-prompt.txt)" \
            -s --no-ask-user > ai-response.txt 2>&1

          cat ai-response.txt

      - name: Publish AI diagnosis
        if: always()
        run: |
          echo "## AI Build Diagnosis" >> "$GITHUB_STEP_SUMMARY"

          if [ -s ai-response.txt ]; then
            cat ai-response.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Copilot did not generate a response." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuaStudio-AI-Diagnosis
          path: |
            error_excerpt.txt
            ai-response.txt
